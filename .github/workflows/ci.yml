name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # A newer push to the same branch or PR cancels the run it supersedes.
    concurrency:
      group: ci-${{ github.ref }}-${{ matrix.node-version }}
      cancel-in-progress: true

    strategy:
      matrix:
        node-version: [24, 26, latest]

    steps:
      - uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - if: matrix.node-version != 24
        run: npm test
      # Node 24 runs the tests with coverage and puts the totals in the job summary.
      - if: matrix.node-version == 24
        run: npm run coverage
      - if: matrix.node-version == 24
        name: Coverage summary
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const rows = ["statements", "branches", "functions", "lines"]
              .map((k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`);
            console.log(["### Coverage", "", "| | % | Covered |", "| --- | --: | --: |", ...rows].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      # Only Node 24's build is deployed, so the other legs check and test only.
      - if: matrix.node-version == 24
        run: npm run build
      - if: matrix.node-version == 24
        run: npm run bundle:budget
      - name: Upload Pages artifact
        if: matrix.node-version == 24 && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
